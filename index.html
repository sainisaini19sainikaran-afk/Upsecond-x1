<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSECOND X1 | AI Voice Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#090812;color:#fff;padding:20px}
.box{max-width:720px;margin:0 auto;background:#151222;border:1px solid #3c295c;border-radius:16px;padding:20px}
h1{font-size:28px;color:#c8a7ff;margin-bottom:8px}
p{color:#bdb6ca;font-size:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
select,input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #442d6e;background:#0e0b19;color:#fff;font-size:14px}
textarea{min-height:100px;margin-bottom:12px}
button{padding:11px 18px;border-radius:10px;border:0;background:#8848eb;color:#fff;font-weight:700;cursor:pointer}
button.sec{background:#231b38;border:1px solid #4b3178}
.bar{height:4px;background:#261c3d;border-radius:99px;overflow:hidden;margin:10px 0}
.bar span{display:block;height:100%;width:30%;background:#c8a7ff;transition:transform .3s}
.status{font-size:13px;color:#d6beff;margin-top:8px}
.hist{margin-top:14px;border-top:1px solid #2b1f45;padding-top:12px;font-size:13px;color:#cfc5e6}
</style>
</head>
<body>
<div class="box">
  <h1>UPSECOND X1</h1>
  <p>AI Voice Studio — Hindi &amp; English • Male &amp; Female</p>

  <div class="row" id="authBox">
    <input type="text" id="uName" placeholder="Your Name" style="flex:1;min-width:160px">
    <input type="email" id="uEmail" placeholder="Your Email" style="flex:1;min-width:160px">
    <button type="button" onclick="signIn()">Sign In</button>
  </div>
  <div class="status" id="userStatus">Status: Sign in karke voice chalao</div>

  <div class="bar"><span id="waveBar"></span></div>

  <div class="row">
    <select id="langSel" style="flex:1;min-width:140px">
      <option value="ALL">Hindi + English</option>
      <option value="HI">Hindi</option>
      <option value="EN">English</option>
    </select>
    <select id="genSel" style="flex:1;min-width:140px">
      <option value="FEMALE">Female Style</option>
      <option value="MALE">Male Style</option>
    </select>
    <button type="button" class="sec" id="pwrBtn" onclick="togglePwr()">ON</button>
  </div>

  <textarea id="txt">Namaste! UPSECOND X1 Voice Studio ab chal raha hai.</textarea>

  <div class="row">
    <button type="button" onclick="speakNow()">Speak</button>
    <button type="button" class="sec" onclick="stopNow()">Stop</button>
  </div>

  <div class="status" id="vStatus">Ready</div>
  <div class="hist" id="histBox">History: Khali</div>
</div>

<script>
let isOn = true;
let hist = [];

function getUser(){
  try{return JSON.parse(localStorage.getItem('x1_user')||'null');}catch(e){return null;}
}
function showUser(){
  const u = getUser();
  document.getElementById('userStatus').textContent = u
    ? ('Signed in: ' + u.name + ' (' + u.email + ')')
    : 'Status: Sign in karke voice chalao';
}
function signIn(){
  const n = document.getElementById('uName').value.trim();
  const e = document.getElementById('uEmail').value.trim();
  if(!n || !e){
    document.getElementById('userStatus').textContent = 'Naam aur email dono likho.';
    return;
  }
  localStorage.setItem('x1_user', JSON.stringify({name:n,email:e}));
  showUser();
}
function togglePwr(){
  isOn = !isOn;
  document.getElementById('pwrBtn').textContent = isOn ? 'ON' : 'OFF';
  if(!isOn) stopNow();
  document.getElementById('vStatus').textContent = isOn ? 'Ready' : 'Studio OFF';
}
function setBar(active){
  document.getElementById('waveBar').style.transform = active ? 'translateX(220%)' : 'translateX(0%)';
}
function speakNow(){
  if(!isOn){document.getElementById('vStatus').textContent='Studio OFF hai.';return;}
  if(!getUser()){document.getElementById('vStatus').textContent='Pehle Sign In karo.';return;}
  const t = document.getElementById('txt').value.trim();
  if(!t){document.getElementById('vStatus').textContent='Text likho.';return;}
  if(!('speechSynthesis' in window)){document.getElementById('vStatus').textContent='Voice support nahi hai.';return;}

  const lang = document.getElementById('langSel').value;
  const gen = document.getElementById('genSel').value;
  const voices = window.speechSynthesis.getVoices() || [];
  const pick = voices.find(v => {
    const l = (v.lang||'').toLowerCase();
    if(lang==='HI') return l.startsWith('hi');
    if(lang==='EN') return l.startsWith('en');
    return l.startsWith('hi') || l.startsWith('en');
  }) || voices[0] || null;

  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  if(pick){u.voice = pick; u.lang = pick.lang;}
  else{u.lang = lang==='HI' ? 'hi-IN' : 'en-IN';}
  u.pitch = gen==='MALE' ? 0.82 : 1.12;
  u.rate = 0.98;
  u.onstart = () => {setBar(true); document.getElementById('vStatus').textContent='Speaking...';};
  u.onend = () => {setBar(false); document.getElementById('vStatus').textContent='Ready';};
  u.onerror = () => {setBar(false); document.getElementById('vStatus').textContent='Awaaz nahi chali.';};

  hist.unshift(t);
  hist = hist.slice(0,3);
  document.getElementById('histBox').textContent = 'History: ' + hist.join(' | ');
  window.speechSynthesis.speak(u);
}
function stopNow(){
  setBar(false);
  if('speechSynthesis' in window){try{window.speechSynthesis.cancel();}catch(e){}}
  document.getElementById('vStatus').textContent = 'Stopped';
}
showUser();
if('speechSynthesis' in window){window.speechSynthesis.getVoices();}
</script>
</body>
</html>
